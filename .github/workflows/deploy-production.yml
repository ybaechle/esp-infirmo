name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module
        required: true
        type: choice
        options: [backend, ia, mobile]
      version:
        description: Existing release version, for example v1.2.3
        required: true
        type: string
      build:
        description: Build the released revision (false for rollback)
        default: false
        type: boolean
permissions:
  contents: read
  packages: write
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate target
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$MODULE" =~ ^(backend|ia|mobile)$ ]] && [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release target'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.module }}-${{ inputs.version }}
      - name: Validate deployment configuration
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN_HOSTS" || { echo '::error::Missing production SSH configuration'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - uses: docker/login-action@v3
        if: inputs.build
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build released image
        if: inputs.build
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$MODULE:$VERSION"
          docker build -t "$image" "$MODULE"
          docker push "$image"
      - name: Synchronize release configuration and deploy
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$MODULE:$VERSION"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p ~/infirmo'
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes infra/deploy/docker-compose.staging.yml infra/deploy/Caddyfile infra/deploy/deploy.sh "$USER@$HOST:infirmo/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" "bash ~/infirmo/deploy.sh $MODULE $image"
