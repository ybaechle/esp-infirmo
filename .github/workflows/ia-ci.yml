name: Ia CI
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    working-directory: ia
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: ia/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70 --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ia-quality
          path: |
            ia/coverage.xml
            ia/test-results.xml
          if-no-files-found: warn
