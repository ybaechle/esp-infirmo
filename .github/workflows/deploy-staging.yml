name: Deploy Staging
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [develop]
permissions:
  contents: read
concurrency: deploy-staging
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Validate deployment configuration
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$KEY" && test -n "$KNOWN_HOSTS" || { echo '::error::Missing staging SSH configuration'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Image coordinates
        id: image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified revision
        env:
          BASE: ${{ steps.image.outputs.base }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          for module in backend ia mobile; do
            docker build -t "$BASE/$module:$TAG" "$module"
            docker push "$BASE/$module:$TAG"
          done
      - name: Synchronize configuration and deploy
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          BASE: ${{ steps.image.outputs.base }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" 'mkdir -p ~/infirmo'
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes infra/deploy/docker-compose.staging.yml infra/deploy/Caddyfile infra/deploy/deploy.sh infra/check_v01.py "$USER@$HOST:infirmo/"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" "bash ~/infirmo/deploy.sh backend $BASE/backend:$TAG ia $BASE/ia:$TAG mobile $BASE/mobile:$TAG"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" 'cd ~/infirmo && docker compose --env-file .env --env-file .images.env -f docker-compose.staging.yml exec -T backend python - --url http://mobile < check_v01.py'
