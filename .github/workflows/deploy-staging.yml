name: Deploy Staging

# INF-13 — build + push des images backend/ia sur GHCR puis déploiement SSH
# sur le serveur staging (hébergement Docker non-HDS, données SYNTHÉTIQUES
# uniquement — voir infra/hds/README.md et AGENTS.md §5).
#
# - push sur develop (ou workflow_dispatch) : build-push construit et publie
#   les images, puis deploy se connecte en SSH pour les tirer et redémarrer
#   le stack.
# - pull_request touchant uniquement ce fichier : build-validation construit
#   les images SANS les publier, pour donner un check vert auto-prouvé sur la
#   PR sans droits d'écriture sur le registre.
on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "ia/**"
      - "infra/deploy/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-staging.yml"

permissions:
  contents: read

jobs:
  build-push:
    name: Build + push images (GHCR)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.vars.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        id: vars
        run: echo "image_base=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: SHA court
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_base }}/backend:develop
            ghcr.io/${{ steps.vars.outputs.image_base }}/backend:sha-${{ steps.sha.outputs.short }}

      - name: Build + push ia
        uses: docker/build-push-action@v6
        with:
          context: ./ia
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.image_base }}/ia:develop
            ghcr.io/${{ steps.vars.outputs.image_base }}/ia:sha-${{ steps.sha.outputs.short }}

  build-validation:
    name: Build validation (PR sur ce workflow)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false

      - name: Build ia (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./ia
          push: false

  deploy:
    name: Déploiement staging (SSH)
    needs: build-push
    if: needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Déployer sur le serveur staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$STAGING_SSH_HOST" ] || [ -z "$STAGING_SSH_USER" ] || [ -z "$STAGING_SSH_KEY" ]; then
            echo "::notice::Pas de serveur staging configuré — déploiement sauté"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$STAGING_SSH_USER@$STAGING_SSH_HOST" bash -s <<'REMOTE'
            set -e
            docker compose -f ~/infirmo/docker-compose.staging.yml pull
            docker compose -f ~/infirmo/docker-compose.staging.yml up -d
          REMOTE
