name: Release

# semantic-release par module : tags backend-vX.Y.Z, ia-vX.Y.Z, mobile-vX.Y.Z
# à partir de l'historique Conventional Commits (voir CONTRIBUTING.md §10).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency: release

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  release:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      # séquentiel : évite les courses sur les tags/releases
      max-parallel: 1
      matrix:
        module: [backend, ia, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tags before release
        run: git tag -l '${{ matrix.module }}-v*' > /tmp/tags-before
      - name: semantic-release ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Explicit production handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE: ${{ matrix.module }}
        run: |
          git tag -l "$MODULE-v*" > /tmp/tags-after
          new_tag=$(comm -13 <(sort /tmp/tags-before) <(sort /tmp/tags-after))
          if [ -n "$new_tag" ]; then
            gh workflow run deploy-production.yml --ref main -f module="$MODULE" -f version="${new_tag#"$MODULE"-}" -F build=true
          fi
