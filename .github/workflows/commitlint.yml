name: Commitlint

on:
  pull_request:
    # "edited" inclus : corriger le titre d'une PR relance le lint du titre
    # (le titre devient le message du commit de squash sur develop).
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint des commits de la PR
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # develop est fusionnée en squash : le titre de la PR devient le message
      # du commit de merge, il doit donc être conventionnel lui aussi.
      - name: Lint du titre de la PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
