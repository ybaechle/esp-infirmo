# infirmo-backend
#
# Scaffold DevOps minimal (INF-8 — Docker Compose local). Ce pyproject.toml
# fournit juste assez de code (health checks) pour valider l'orchestration
# Docker Compose. L'équipe backend (Louis/Ziad, INF-2+) remplacera ce
# scaffold par l'application FastAPI réelle (routes, SQLAlchemy/Alembic,
# domaine métier).

[project]
name = "infirmo-backend"
version = "0.1.0"
description = "API HTTP Infirmo (FastAPI) — scaffold DevOps, à remplacer par l'équipe backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.139.0",
    "psycopg[binary]~=3.3.4",
    "redis~=8.0.1",
    "uvicorn[standard]~=0.49.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.1.1",
    "ruff~=0.15.20",
]

[tool.pytest.ini_options]
# Rend `app` importable depuis tests/ sans installer le paquet (pas de
# build-system : ce scaffold n'est pas destiné à être packagé/publié).
pythonpath = ["."]
