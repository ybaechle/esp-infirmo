[project]
name = "infirmo-backend"
version = "0.1.0"
description = "API Infirmo — parcours de démonstration synthétique T9"
requires-python = ">=3.12"
dependencies = [
    "alembic~=1.18.4",
    "cryptography~=50.0.2",
    "fastapi~=0.139.0",
    "prometheus-fastapi-instrumentator~=8.0.2",
    "psycopg[binary]~=3.3.4",
    "python-multipart~=0.0.32",
    "redis~=8.0.1",
    "sqlalchemy~=2.0.48",
    "uvicorn[standard]~=0.49.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "pytest~=9.1.1",
    "pytest-cov~=7.0.0",
    "ruff~=0.15.20",
]

[tool.pytest.ini_options]
# Rend `app` importable depuis tests/ sans installer le paquet (pas de
# build-system : ce scaffold n'est pas destiné à être packagé/publié).
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
markers = [
    "postgres: integration requiring TEST_DATABASE_URL and a disposable PostgreSQL database",
    "realtime: uses the real Redis pub/sub configured by REDIS_URL",
]
