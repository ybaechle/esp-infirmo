# Configuration Prometheus — profil "monitoring" (INF-15).
#
# Portée : dev local / staging avec données SYNTHÉTIQUES uniquement (voir
# infra/monitoring/README.md et AGENTS.md). Ne scrape que l'endpoint
# /metrics du backend, qui n'expose que des compteurs/latences par route —
# jamais de contenu de requête/réponse (AGENTS.md).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
